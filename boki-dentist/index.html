        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Global Styles */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
        }
        
        a {
            text-decoration: none;
            color: #2d8cc0;
        }
        
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #2d8cc0;
            color: white;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background-color: #1f6b96;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-secondary {
            background-color: #f8f8f8;
            color: #2d8cc0;
            border: 2px solid #2d8cc0;
        }
        
        .btn-secondary:hover {
            background-color: #e8f5fc;
        }
        
        .section-title {
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            color: #2d8cc0;
            position: relative;
            padding-bottom: 10px;
        }
        
        .section-title:after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 3px;
            background-color: #2d8cc0;
        }
        
        section {
            padding: 80px 0;
        }

        }

            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d8cc0;
        }
        
        .logo span {
            color: #333;
        }

        }

            margin-left: 30px;
        }

        }
        
        .nav-links a:hover {
            color: #2d8cc0;
        }

        }

        }

            margin-bottom: 20px;
            color: #2d8cc0;
        }

            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #333;
        }
