<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Tara Šljukić | Aesthetic Medicine Specialist | Novi Sad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 
        --------------------------------
        CSS Custom Properties (Variables)
        --------------------------------
        */
        :root {
            /* Primary Color Palette */
            --color-primary: #8C7B6A;
            --color-primary-light: #A69787;
            --color-primary-dark: #6A5C4E;
            --color-secondary: #D3CBBF;
            --color-secondary-light: #EAE6E0;
            --color-secondary-dark: #A9A295;
            --color-accent: #D1B894;
            --color-accent-light: #E8DAC4;
            --color-accent-dark: #AB9674;
            
            /* Text Colors */
            --color-text-primary: #333333;
            --color-text-secondary: #666666;
            --color-text-tertiary: #888888;
            --color-text-light: #FFFFFF;
            
            /* Background Colors */
            --color-bg-primary: #FFFFFF;
            --color-bg-secondary: #FAF8F5;
            --color-bg-tertiary: #F2EEE9;
            --color-bg-accent: #F7F4F0;
            
            /* Border Colors */
            --color-border-light: rgba(140, 123, 106, 0.1);
            --color-border-medium: rgba(140, 123, 106, 0.25);
            
            /* Typography */
            --font-primary: 'Cormorant Garamond', serif;
            --font-secondary: 'Montserrat', sans-serif;
            
            /* Font Weights */
            --weight-thin: 100;
            --weight-extra-light: 200;
            --weight-light: 300;
            --weight-regular: 400;
            --weight-medium: 500;
            --weight-semi-bold: 600;
            --weight-bold: 700;
            
            /* Spacing Units */
            --space-unit: 1rem;
            --space-xxs: calc(0.25 * var(--space-unit));
            --space-xs: calc(0.5 * var(--space-unit));
            --space-sm: calc(0.75 * var(--space-unit));
            --space-md: calc(1.25 * var(--space-unit));
            --space-lg: calc(2 * var(--space-unit));
            --space-xl: calc(3.25 * var(--space-unit));
            --space-xxl: calc(5.25 * var(--space-unit));
            
            /* Container Width */
            --container-max-width: 1200px;
            --container-narrow-width: 960px;
            --container-padding: var(--space-md);
            
            /* Border Radius */
            --radius-sm: 2px;
            --radius-md: 4px;
            --radius-lg: 8px;
            --radius-xl: 16px;
            --radius-xxl: 24px;
            --radius-round: 9999px;
            
            /* Box Shadows */
            --shadow-subtle: 0 2px 10px rgba(0, 0, 0, 0.03);
            --shadow-light: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-strong: 0 12px 32px rgba(0, 0, 0, 0.1);
            
            /* Transitions */
            --transition-fast: 0.2s ease;
            --transition-medium: 0.3s ease;
            --transition-slow: 0.5s ease;
            
            /* Z-index Layers */
            --z-background: -10;
            --z-elements: 10;
            --z-header: 100;
            --z-overlay: 200;
            --z-modal: 300;
            --z-max: 999;
        }

        /* 
        --------------------------------
        Base Styles & Resets
        --------------------------------
        */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: var(--font-secondary);
            font-weight: var(--weight-light);
            line-height: 1.6;
            color: var(--color-text-primary);
            background-color: var(--color-bg-primary);
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, h5 {
            font-family: var(--font-primary);
            font-weight: var(--weight-regular);
            line-height: 1.2;
            margin-bottom: var(--space-md);
            color: var(--color-text-primary);
        }
        
        h1 {
            font-size: clamp(2.25rem, 5vw, 3.75rem);
            font-weight: var(--weight-medium);
            letter-spacing: -0.02em;
        }
        
        h2 {
            font-size: clamp(1.75rem, 4vw, 2.75rem);
            letter-spacing: -0.015em;
        }
        
        h3 {
            font-size: clamp(1.375rem, 3vw, 2.25rem);
            letter-spacing: -0.01em;
        }
        
        h4 {
            font-size: clamp(1.125rem, 2vw, 1.5rem);
        }
        
        p {
            margin-bottom: var(--space-md);
            color: var(--color-text-secondary);
            font-weight: var(--weight-light);
            max-width: 65ch;
        }
        
        a {
            color: var(--color-primary);
            text-decoration: none;
            transition: all var(--transition-fast);
        }
        
        a:hover, a:focus {
            color: var(--color-primary-dark);
            text-decoration: none;
        }
        
        img, svg {
            max-width: 100%;
            display: block;
        }
        
        button, .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-sm) var(--space-lg);
            font-family: var(--font-secondary);
            font-size: 0.875rem;
            font-weight: var(--weight-medium);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--color-text-light);
            background-color: var(--color-primary);
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-medium);
            position: relative;
            overflow: hidden;
        }
        
        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
            background-color: var(--color-primary-dark);
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
        }
        
        .btn-secondary:hover {
            background-color: var(--color-primary);
            color: var(--color-text-light);
        }
        
        .btn-large {
            padding: var(--space-md) var(--space-xl);
            font-size: 1rem;
        }
        
        ul {
            list-style: none;
        }
        
        section {
            padding: var(--space-xl) 0;
            position: relative;
        }
        
        .container {
            width: 100%;
            max-width: var(--container-max-width);
            margin-left: auto;
            margin-right: auto;
            padding-left: var(--container-padding);
            padding-right: var(--container-padding);
        }
        
        .container-narrow {
            max-width: var(--container-narrow-width);
        }
        
        .center-text {
            text-align: center;
        }
        
        .section-title {
            margin-bottom: var(--space-lg);
            position: relative;
            z-index: 1;
        }
        
        .section-subtitle {
            display: block;
            color: var(--color-primary);
            font-family: var(--font-secondary);
            font-size: 0.875rem;
            font-weight: var(--weight-medium);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: var(--space-xs);
        }
        
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* 
        --------------------------------
        Header & Navigation
        --------------------------------
        */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: var(--space-md) 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: var(--z-header);
            transition: all var(--transition-medium);
        }
        
        .header.scrolled {
            padding: var(--space-xs) 0;
            box-shadow: var(--shadow-subtle);
        }
        
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: var(--weight-medium);
            color: var(--color-text-primary);
            transition: all var(--transition-fast);
        }
        
        .logo:hover {
            color: var(--color-primary);
        }
        
        .nav-list {
            display: flex;
            align-items: center;
            gap: var(--space-lg);
        }
        
        .nav-link {
            position: relative;
            font-family: var(--font-secondary);
            font-size: 0.875rem;
            font-weight: var(--weight-medium);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--color-text-secondary);
            padding: var(--space-xs) 0;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--color-primary);
            transition: width var(--transition-medium);
        }
        
        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        
        .nav-link:hover,
        .nav-link.active {
            color: var(--color-primary);
        }
        
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--color-text-primary);
            padding: var(--space-xs);
            cursor: pointer;
        }

        /* 
        --------------------------------
        Hero Section
        --------------------------------
        */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 96px;
            overflow: hidden;
            background-color: var(--color-bg-tertiary);
        }
        
        .hero-content {
            position: relative;
            z-index: var(--z-elements);
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 1s var(--transition-medium) both;
            animation-delay: 0.3s;
        }
        
        .hero-tagline {
            color: var(--color-primary);
            font-family: var(--font-secondary);
            font-size: 1rem;
            font-weight: var(--weight-medium);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: var(--space-md);
            opacity: 0;
            animation: fadeInUp 1s var(--transition-medium) both;
            animation-delay: 0.5s;
        }
        
        .hero-title {
            margin-bottom: var(--space-lg);
            opacity: 0;
            animation: fadeInUp 1s var(--transition-medium) both;
            animation-delay: 0.7s;
        }
        
        .hero-description {
            font-size: 1.125rem;
            margin-bottom: var(--space-xl);
            opacity: 0;
            animation: fadeInUp 1s var(--transition-medium) both;
            animation-delay: 0.9s;
        }
        
        .hero-cta {
            display: flex;
            gap: var(--space-md);
            opacity: 0;
            animation: fadeInUp 1s var(--transition-medium) both;
            animation-delay: 1.1s;
        }
        
        .hero-image {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 50%;
            height: 85%;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
            overflow: hidden;
            opacity: 0;
            animation: fadeInRight 1s var(--transition-medium) both;
            animation-delay: 1.3s;
        }
        
        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .hero-backdrop {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            background-color: var(--color-secondary-light);
            clip-path: polygon(100px 0, 100% 0, 100% 100%, 0 100%);
            z-index: var(--z-background);
        }

        /* 
        --------------------------------
        About Section
        --------------------------------
        */
        .about {
            background-color: var(--color-bg-primary);
            padding: var(--space-xxl) 0;
        }
        
        .about-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-xl);
            align-items: center;
        }
        
        .about-image {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-medium);
            height: 100%;
            min-height: 500px;
        }
        
        .about-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .about-image::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 80%;
            height: 80%;
            border: 1px solid var(--color-primary);
            border-radius: var(--radius-lg);
            z-index: -1;
        }
        
        .about-content {
            padding-left: var(--space-lg);
        }
        
        .about-title {
            margin-bottom: var(--space-md);
        }
        
        .about-text {
            margin-bottom: var(--space-lg);
        }
        
        .signature {
            margin-top: var(--space-lg);
            font-family: var(--font-primary);
            font-size: 1.75rem;
            font-style: italic;
            color: var(--color-primary);
        }
        
        .credentials {
            display: flex;
            gap: var(--space-lg);
            margin-top: var(--space-lg);
        }
        
        .credential-item {
            border-left: 2px solid var(--color-primary);
            padding-left: var(--space-md);
        }
        
        .credential-number {
            font-family: var(--font-primary);
            font-size: 2rem;
            font-weight: var(--weight-medium);
            color: var(--color-primary);
            line-height: 1;
        }
        
        .credential-text {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
        }

        /* 
        --------------------------------
        Services Section
        --------------------------------
        */
        .services {
            background-color: var(--color-bg-secondary);
            padding: var(--space-xxl) 0;
        }
        
        .services-intro {
            max-width: 760px;
            margin: 0 auto var(--space-xl);
            text-align: center;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-lg);
        }
        
        .service-card {
            background-color: var(--color-bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            transition: all var(--transition-medium);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            height: 100%;
        }
        
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }
        
        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, var(--color-primary), var(--color-accent));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--transition-medium);
        }
        
        .service-card:hover::before {
            transform: scaleX(1);
        }
        
        .service-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: var(--radius-round);
            background-color: var(--color-bg-tertiary);
            color: var(--color-primary);
            margin-bottom: var(--space-md);
            transition: all var(--transition-medium);
        }
        
        .service-card:hover .service-icon {
            background-color: var(--color-primary);
            color: var(--color-text-light);
        }
        
        .service-title {
            font-size: 1.25rem;
            margin-bottom: var(--space-sm);
        }
        
        .service-description {
            color: var(--color-text-tertiary);
            font-size: 0.875rem;
            margin-bottom: var(--space-md);
        }
        
        .service-link {
            display: inline-flex;
            align-items: center;
            font-size: 0.875rem;
            font-weight: var(--weight-medium);
            color: var(--color-primary);
        }
        
        .service-link svg {
            width: 18px;
            height: 18px;
            margin-left: var(--space-xs);
            transition: transform var(--transition-fast);
        }
        
        .service-link:hover svg {
            transform: translateX(4px);
        }

        /* 
        --------------------------------
        Process Section
        --------------------------------
        */
        .process {
            padding: var(--space-xxl) 0;
        }
        
        .process-intro {
            max-width: 760px;
            margin: 0 auto var(--space-xl);
            text-align: center;
        }
        
        .process-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--space-lg);
        }
        
        .process-step {
            text-align: center;
            position: relative;
            padding: var(--space-lg);
        }
        
        .process-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 80px;
            right: -30px;
            width: 60px;
            height: 2px;
            background-color: var(--color-border-medium);
            z-index: 0;
        }
        
        .step-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 0 auto var(--space-md);
            border-radius: var(--radius-round);
            background-color: var(--color-bg-tertiary);
            color: var(--color-primary);
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: var(--weight-medium);
            position: relative;
            z-index: 1;
            transition: all var(--transition-medium);
        }
        
        .process-step:hover .step-number {
            background-color: var(--color-primary);
            color: var(--color-text-light);
            transform: scale(1.1);
        }
        
        .step-title {
            font-size: 1.25rem;
            margin-bottom: var(--space-sm);
        }
        
        .step-description {
            color: var(--color-text-tertiary);
            font-size: 0.875rem;
        }

        /* 
        --------------------------------
        Gallery Section
        --------------------------------
        */
        .gallery {
            background-color: var(--color-bg-tertiary);
            padding: var(--space-xxl) 0;
        }
        
        .gallery-intro {
            max-width: 760px;
            margin: 0 auto var(--space-xl);
            text-align: center;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 300px;
            gap: var(--space-md);
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-md);
            cursor: pointer;
        }
        
        .gallery-item:nth-child(3n-1) {
            grid-row: span 2;
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-medium);
        }
        
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        
        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
            opacity: 0;
            transition: opacity var(--transition-medium);
            display: flex;
            align-items: flex-end;
            padding: var(--space-md);
        }
        
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        
        .gallery-caption {
            color: var(--color-text-light);
            font-family: var(--font-primary);
            font-size: 1.25rem;
            transform: translateY(20px);
            transition: transform var(--transition-medium);
        }
        
        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }

        /* 
        --------------------------------
        Testimonials Section
        --------------------------------
        */
        .testimonials {
            padding: var(--space-xxl) 0;
        }
        
        .testimonials-intro {
            max-width: 760px;
            margin: 0 auto var(--space-xl);
            text-align: center;
        }
        
        .testimonials-slider {
            position: relative;
            max-width: 960px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        .testimonials-container {
            display: flex;
            transition: transform var(--transition-slow);
        }
        
        .testimonial-slide {
            min-width: 100%;
            padding: var(--space-lg);
        }
        
        .testimonial-card {
            position: relative;
            background-color: var(--color-bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-subtle);
            text-align: center;
        }
        
        .testimonial-card::before {
            content: '"';
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-primary);
            font-size: 6rem;
            line-height: 1;
            color: var(--color-primary);
            opacity: 0.2;
        }
        
        .testimonial-text {
            font-family: var(--font-primary);
            font-size: 1.25rem;
            font-style: italic;
            margin-bottom: var(--space-lg);
        }
        
        .testimonial-author {
            font-weight: var(--weight-medium);
            margin-bottom: var(--space-xxs);
        }
        
        .testimonial-position {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
        }
        
        .testimonial-rating {
            display: flex;
            justify-content: center;
            margin-top: var(--space-md);
            color: var(--color-accent);
        }
        
        .testimonial-controls {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            margin-top: var(--space-lg);
        }
        
        .testimonial-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-round);
            background-color: var(--color-bg-tertiary);
            color: var(--color-primary);
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        
        .testimonial-btn:hover {
            background-color: var(--color-primary);
            color: var(--color-text-light);
        }
        
        .testimonial-indicators {
            display: flex;
            justify-content: center;
            gap: var(--space-xs);
            margin-top: var(--space-md);
        }
        
        .testimonial-dot {
            width: 10px;
            height: 10px;
            border-radius: var(--radius-round);
            background-color: var(--color-border-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .testimonial-dot.active {
            background-color: var(--color-primary);
            transform: scale(1.2);
        }

        /* 
        --------------------------------
        FAQ Section
        --------------------------------
        */
        .faq {
            background-color: var(--color-bg-secondary);
            padding: var(--space-xxl) 0;
        }
        
        .faq-intro {
            max-width: 760px;
            margin: 0 auto var(--space-xl);
            text-align: center;
        }
        
        .faq-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .faq-item {
            margin-bottom: var(--space-md);
            border-radius: var(--radius-md);
            overflow: hidden;
            background-color: var(--color-bg-primary);
            box-shadow: var(--shadow-subtle);
        }
        
        .faq-question {
            padding: var(--space-md) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all var(--transition-fast);
            background-color: var(--color-bg-primary);
            border: none;
            width: 100%;
            text-align: left;
        }
        
        .faq-question h4 {
            font-family: var(--font-secondary);
            font-size: 1rem;
            font-weight: var(--weight-medium);
            margin-bottom: 0;
        }
        
        .faq-question:hover {
            background-color: var(--color-bg-secondary);
        }
        
        .faq-icon {
            width: 20px;
            height: 20px;
            position: relative;
            transition: transform var(--transition-medium);
        }
        
        .faq-icon::before,
        .faq-icon::after {
            content: '';
            position: absolute;
            background-color: var(--color-primary);
            transition: all var(--transition-medium);
        }
        
        .faq-icon::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }
        
        .faq-icon::after {
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
        
        .faq-question[aria-expanded="true"] .faq-icon::after {
            transform: translateX(-50%) scaleY(0);
        }
        
        .faq-answer {
            padding: 0 var(--space-lg);
            max-height: 0;
            overflow: hidden;
            transition: all var(--transition-medium);
        }
        
        .faq-answer-inner {
            padding-bottom: var(--space-lg);
        }

        /* 
        --------------------------------
        Contact Section
        --------------------------------
        */
        .contact {
            padding: var(--space-xxl) 0;
            position: relative;
            overflow: hidden;
        }
        
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-xl);
            align-items: center;
        }
        
        .contact-info {
            padding-right: var(--space-lg);
        }
        
        .contact-methods {
            margin-top: var(--space-lg);
        }
        
        .contact-method {
            display: flex;
            align-items: flex-start;
            margin-bottom: var(--space-md);
        }
        
        .contact-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-round);
            background-color: var(--color-bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-primary);
            margin-right: var(--space-md);
            flex-shrink: 0;
            transition: all var(--transition-fast);
        }
        
        .contact-method:hover .contact-icon {
            background-color: var(--color-primary);
            color: var(--color-text-light);
        }
        
        .contact-text {
            padding-top: var(--space-xs);
        }
        
        .contact-text h4 {
            font-family: var(--font-secondary);
            font-size: 1.125rem;
            margin-bottom: var(--space-xxs);
        }
        
        .contact-text p, .contact-text a {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
            margin-bottom: var(--space-xxs);
        }
        
        .contact-form {
            background-color: var(--color-bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: var(--shadow-medium);
        }
        
        .form-group {
            margin-bottom: var(--space-md);
        }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: var(--weight-medium);
            margin-bottom: var(--space-xs);
            color: var(--color-text-secondary);
        }
        
        .form-input,
        .form-textarea {
            width: 100%;
            padding: var(--space-sm) var(--space-md);
            font-family: var(--font-secondary);
            font-size: 0.875rem;
            color: var(--color-text-primary);
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border-light);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }
        
        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            background-color: var(--color-bg-primary);
            box-shadow: 0 0 0 3px rgba(140, 123, 106, 0.1);
        }
        
        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .form-submit {
            width: 100%;
            margin-top: var(--space-md);
        }
        
        .input-error {
            border-color: #e74c3c !important;
        }
        
        .error-message {
            font-size: 0.75rem;
            color: #e74c3c;
            margin-top: var(--space-xxs);
            display: none;
        }
        
        .error-message.visible {
            display: block;
            animation: fadeIn var(--transition-fast) forwards;
        }

        /* 
        --------------------------------
        Footer Section
        --------------------------------
        */
        .footer {
            background-color: var(--color-bg-tertiary);
            padding: var(--space-xl) 0 var(--space-lg);
        }
        
        .footer-container {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: var(--space-lg);
        }
        
        .footer-logo {
            font-family: var(--font-primary);
            font-size: 1.5rem;
            font-weight: var(--weight-medium);
            color: var(--color-text-primary);
            margin-bottom: var(--space-md);
            display: inline-block;
        }
        
        .footer-text {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
            margin-bottom: var(--space-md);
        }
        
        .footer-social {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }
        
        .social-link {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-round);
            background-color: var(--color-bg-secondary);
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        
        .social-link:hover {
            background-color: var(--color-primary);
            color: var(--color-text-light);
            transform: translateY(-3px);
        }
        
        .footer-title {
            font-size: 1rem;
            font-weight: var(--weight-medium);
            color: var(--color-text-primary);
            margin-bottom: var(--space-md);
            font-family: var(--font-secondary);
        }
        
        .footer-links {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }
        
        .footer-link {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
            transition: all var(--transition-fast);
            display: inline-block;
        }
        
        .footer-link:hover {
            color: var(--color-primary);
            transform: translateX(3px);
        }
        
        .copyright {
            text-align: center;
            font-size: 0.75rem;
            color: var(--color-text-tertiary);
            margin-top: var(--space-xl);
            padding-top: var(--space-md);
            border-top: 1px solid var(--color-border-light);
        }

        /* 
        --------------------------------
        Animations
        --------------------------------
        */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(50px) translateY(-50%);
            }
            to {
                opacity: 1;
                transform: translateX(0) translateY(-50%);
            }
        }
        
        @keyframes rotateIn {
            from {
                opacity: 0;
                transform: rotate(-90deg);
            }
            to {
                opacity: 1;
                transform: rotate(0);
            }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity var(--transition-medium), transform var(--transition-medium);
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 
        --------------------------------
        Responsive Styles
        --------------------------------
        */
        @media (max-width: 1200px) {
            .hero-image {
                width: 45%;
            }
            
            .process-step:not(:last-child)::after {
                display: none;
            }
            
            .footer-container {
                grid-template-columns: 1fr 1fr;
                gap: var(--space-xl) var(--space-lg);
            }
        }
        
        @media (max-width: 992px) {
            :root {
                --container-padding: var(--space-md);
            }
            
            .hero {
                min-height: auto;
                padding: 120px 0 var(--space-xxl);
            }
            
            .hero-content {
                max-width: 100%;
                text-align: center;
                margin: 0 auto;
            }
            
            .hero-cta {
                justify-content: center;
            }
            
            .hero-image {
                position: relative;
                width: 100%;
                height: 400px;
                margin-top: var(--space-xl);
                transform: none;
                border-radius: var(--radius-lg);
                right: auto;
                top: auto;
            }
            
            .hero-backdrop {
                display: none;
            }
            
            .about-container {
                grid-template-columns: 1fr;
            }
            
            .about-image {
                margin-bottom: var(--space-lg);
                min-height: 400px;
            }
            
            .about-content {
                padding-left: 0;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .gallery-item:nth-child(3n-1) {
                grid-row: auto;
            }
            
            .gallery-item:nth-child(4n-1) {
                grid-row: span 2;
            }
            
            .contact-container {
                grid-template-columns: 1fr;
            }
            
            .contact-info {
                padding-right: 0;
                margin-bottom: var(--space-lg);
            }
        }
        
        @media (max-width: 768px) {
            :root {
                --space-xxl: calc(4 * var(--space-unit));
                --space-xl: calc(2.5 * var(--space-unit));
            }
            
            .header-container {
                position: relative;
            }
            
            .nav-list {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background-color: var(--color-bg-primary);
                flex-direction: column;
                justify-content: center;
                gap: var(--space-lg);
                padding: var(--space-xl);
                box-shadow: var(--shadow-strong);
                transition: right var(--transition-medium);
                z-index: var(--z-overlay);
            }
            
            .nav-list.active {
                right: 0;
            }
            
            .nav-toggle {
                display: block;
                z-index: var(--z-max);
            }
            
            .services-grid {
                grid-template-columns: 1fr;
            }
            
            .process-steps {
                grid-template-columns: 1fr;
            }
            
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            
            .gallery-item:nth-child(4n-1) {
                grid-row: auto;
            }
            
            .testimonial-card {
                padding: var(--space-lg);
            }
            
            .testimonial-text {
                font-size: 1rem;
            }
            
            .footer-container {
                grid-template-columns: 1fr;
                gap: var(--space-lg);
            }
            
            .mobile-menu-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                opacity: 0;
                visibility: hidden;
                transition: all var(--transition-medium);
                z-index: var(--z-header);
            }
            
            .mobile-menu-overlay.active {
                opacity: 1;
                visibility: visible;
            }
        }
    </style>
</head>
